<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 88" width="100" height="88">
  <!-- The diamond beside a diamond balance. Used as a CSS mask, like
       icon/coin.png, so it takes the colour of the text around it: the cut
       facets are holes in the mask rather than lines drawn in another
       colour. Drawn tight to its own edges for the same reason as the coin. -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="88">
      <polygon points="22,0 78,0 100,30 50,88 0,30" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
        <polyline points="4,30 96,30"/>
        <polyline points="36,2 28,30 50,84 72,30 64,2"/>
        <polyline points="28,30 50,5 72,30"/>
      </g>
    </mask>
  </defs>
  <rect width="100" height="88" fill="#000" mask="url(#cut)"/>
</svg>
