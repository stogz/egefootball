<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Password — EGE Football</title>
<meta name="robots" content="noindex">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%231d2416'/><ellipse cx='16' cy='16' rx='11' ry='7' fill='%23e56e28'/><path d='M9 16h14' stroke='%23fbf4e6' stroke-width='2'/></svg>">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;800&display=swap">
<link rel="stylesheet" href="organic-styles.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="site.css">
</head>
<body>

<div class="fb-shell">

  <nav class="fb-nav">
    <div class="fb-wrap fb-nav__inner">
      <a class="fb-brand" href="index.html">
        <span class="fb-brand__mark"></span>
        <span class="fb-brand__word">EGE <em>FOOTBALL</em></span>
      </a>
      <div class="fb-nav__links">
        <a class="fb-navlink" href="index.html">Players</a>
      </div>
    </div>
  </nav>

  <div class="fb-wrap ege-narrow">
    <div class="fb-panel">
      <div class="fb-panel__strip">
        <span class="fb-eyebrow" style="color: var(--fb-ink);">Player Portal</span>
      </div>

      <div class="fb-panel__body fb-stack">
        <h1 style="font-size: 30px;">Change Password</h1>

        <!-- while the emailed link is being checked -->
        <p class="fb-meta" id="checking">Checking your link&hellip;</p>

        <!-- link is good: pick a new password -->
        <form class="fb-stack" id="resetForm" hidden>
          <label class="ege-field">
            <span class="fb-eyebrow">New password</span>
            <input class="fb-input" id="newPassword" type="password"
                   autocomplete="new-password" minlength="8" required>
          </label>

          <label class="ege-field">
            <span class="fb-eyebrow">Confirm new password</span>
            <input class="fb-input" id="confirmPassword" type="password"
                   autocomplete="new-password" minlength="8" required>
          </label>

          <p class="ege-note" id="resetMessage" role="alert" hidden></p>

          <button class="fb-btn fb-btn--primary fb-btn--block" id="resetSubmit" type="submit">
            Save Password
          </button>
        </form>

        <!-- link is bad, expired, or already used -->
        <div class="fb-stack" id="resetBlocked" hidden>
          <p class="ege-note ege-note--error" id="blockedMessage"></p>
          <a class="fb-btn fb-btn--block" href="index.html">Back to Players</a>
        </div>

        <!-- done -->
        <div class="fb-stack" id="resetDone" hidden>
          <p class="ege-note ege-note--ok">Password changed. You can sign in with it now.</p>
          <a class="fb-btn fb-btn--primary fb-btn--block" href="index.html">Back to Players</a>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="data/players.js"></script>
<script src="js/auth.js"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
