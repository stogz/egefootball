name: Discord scores

# A backstop. The admin publishes a week from the admin page and that click
# posts it; this catches anything that did not go out — the edge function was
# not deployed, Discord was down, the click half-landed.
#
# Which weeks are out, and which have been posted, lives in Supabase, so
# nothing is written back to this repository and the job needs no write
# access.
#
# Cron is UTC and does not follow daylight saving, so this fires at the UTC
# equivalents of 07:00 / 12:00 / 16:00 / 20:00 America/Chicago under BOTH CST
# and CDT. The script checks the real Chicago hour and exits quietly on the
# runs that belong to the other offset, so posts land at the intended local
# times.

on:
  schedule:
    - cron: '0 1,2,12,13,17,18,21,22 * * *'
  workflow_dispatch:
    inputs:
      week:
        description: 'Post a specific week (blank = anything published but unposted)'
        required: false
      dry_run:
        description: 'Build the post and print it without sending'
        type: boolean
        default: false

concurrency:
  group: discord-scores
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post anything still owed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Server-side key. It reads which weeks are published and marks them
          # posted, and it never goes anywhere near the browser.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SITE_URL: ${{ vars.SITE_URL || 'http://egefootball.vercel.app' }}
        run: |
          node bot/post-week.js \
            ${{ inputs.week && format('--week {0} --force', inputs.week) || '' }} \
            ${{ inputs.dry_run && '--dry-run --force' || '' }}
